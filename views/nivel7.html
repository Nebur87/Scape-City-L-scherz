
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Mapa Final</title>
    <link rel="stylesheet" href="./../css/styles.css">
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar" style="width: 87.5%;">Nivel 7 de 8</div>
    </div>
    <div class="centered-nivel6">
        <h1>El Gran Puzzle del Mapa</h1>
        <p>¡Último reto! Junta todas las piezas del mapa y valida tu resultado.</p>
        <div class="map-validation-area">
            <div style="position:relative;display:inline-block;width:400px;height:300px;">
                <video id="video-mapa" width="400" height="300" autoplay playsinline style="background:#222;position:absolute;top:0;left:0;z-index:1;border-radius:12px;"></video>
                <img src="./../assets/img/silueta-suiza.png" alt="Silueta Suiza" id="silueta-mapa" style="width:329px;height:285px;opacity:0.4;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;">
                <input type="range" id="silueta-opacity" min="0" max="1" step="0.05" value="0.4" style="position:absolute;bottom:10px;left:10px;z-index:3;width:120px;">
                <label for="silueta-opacity" style="position:absolute;bottom:35px;left:10px;z-index:3;background:#fff8;padding:2px 6px;border-radius:6px;font-size:0.9em;">Opacidad silueta</label>
            </div>
            <div style="margin-top:20px;">
                <button id="capture-mapa-btn" disabled>Capturar foto alineada</button>
            </div>
            <div style="display:flex;gap:20px;margin-top:20px;">
                <canvas id="canvas-mapa" width="400" height="300" style="display:none;border-radius:12px;"></canvas>
                <canvas id="canvas-silueta-preview" width="400" height="300" style="display:none;border-radius:12px;"></canvas>
            </div>

            <div id="validation-msg" style="margin-top:20px;"></div>
            <button id="next-level-btn" style="display:none;margin-top:30px;">¡Puzzle validado! Siguiente nivel</button>
        </div>
    </div>
    <script src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="./../js/nivel7.js"></script>
</body>
</html>
